[package]
name = "feint-ffi"
description = "C interface over the Feint core: games and bots as opaque handles speaking protocol envelopes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
airhockey = { path = "../games/airhockey" }
feint-ai.workspace = true
feint-protocol.workspace = true

[features]
test-panic = []

[dev-dependencies]
feint-ffi = { path = ".", features = ["test-panic"] }

[lints]
workspace = true
