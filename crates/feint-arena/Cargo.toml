[package]
name = "feint-arena"
description = "Local server: serves the front, verifies match records by re-running them, stores Parquet and SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
airhockey = { path = "../games/airhockey" }
feint-ai.workspace = true
feint-protocol.workspace = true
feint-web = { path = "../feint-web" }
penalty.workspace = true
duel.workspace = true
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "io-util", "fs", "time"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rand_chacha.workspace = true

[lints]
workspace = true
