# Physics must give bit-identical results on x86_64 and wasm32 (FNT-D4):
# only + - * / and sqrt are allowed on floats.
disallowed-methods = [
    "f64::powi", "f64::powf", "f64::exp", "f64::exp2", "f64::ln", "f64::log", "f64::log2",
    "f64::log10", "f64::hypot", "f64::mul_add", "f64::sin", "f64::cos", "f64::tan",
    "f64::asin", "f64::acos", "f64::atan", "f64::atan2", "f64::sin_cos", "f64::cbrt",
    "f32::powi", "f32::powf", "f32::exp", "f32::ln", "f32::hypot", "f32::mul_add",
    "f32::sin", "f32::cos", "f32::tan", "f32::atan2",
]
