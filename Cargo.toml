[workspace]
resolver = "3"
members = [
    "crates/feint-protocol",
    "crates/feint-ai",
    "crates/games/airhockey",
    "crates/games/airhockey-check",
    "crates/games/penalty",
    "crates/games/duel",
    "crates/games/pingpong",
    "crates/games/kuhn",
    "crates/games/believe",
    "crates/games/cards-check",
    "crates/feint-web",
    "crates/feint-arena",
    "crates/feint-ffi",
    "crates/feint-compare",
    "crates/feint-safetensors",
    "crates/feint-ml",
    "crates/feint-turn",
    "crates/feint-ml-check",
    "crates/feint-context",
]
exclude = ["crates/feint-gym"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
feint-protocol = { path = "crates/feint-protocol" }
feint-ai = { path = "crates/feint-ai" }
feint-context = { path = "crates/feint-context" }
feint-ml = { path = "crates/feint-ml" }
feint-safetensors = { path = "crates/feint-safetensors" }
feint-turn = { path = "crates/feint-turn" }
penalty = { path = "crates/games/penalty" }
duel = { path = "crates/games/duel" }
pingpong = { path = "crates/games/pingpong" }
kuhn = { path = "crates/games/kuhn" }
believe = { path = "crates/games/believe" }
flatbuffers = "=25.12.19"
rand_chacha = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev.package.feint-turn]
opt-level = 3

[profile.dev.package.believe]
opt-level = 3

[profile.dev.package.feint-ai]
opt-level = 3
