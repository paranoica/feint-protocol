<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feint — air hockey</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <section id="level" class="screen">
      <div class="card">
        <h1>Feint</h1>
        <p class="tagline">Air hockey against a bot that reads you and lies with its body.</p>
        <label class="nick">Nick <input id="nick" maxlength="64" autocomplete="nickname" /></label>
        <div class="levels">
          <button data-level="1" disabled><b>1</b><span>Rookie</span></button>
          <button data-level="2" disabled><b>2</b><span>Novice</span></button>
          <button data-level="3" disabled><b>3</b><span>Amateur</span></button>
          <button data-level="4" disabled><b>4</b><span>Pro</span></button>
          <button data-level="5" disabled><b>5</b><span>Feint</span></button>
        </div>
        <p class="hint">Hold the mouse button or a finger on the table and drag your mallet. First to 7. Press D to see what the bot is thinking.</p>
      </div>
    </section>
    <section id="game" class="screen game" hidden>
      <canvas id="table"></canvas>
      <header class="hud">
        <span id="who" class="side-label"></span>
        <span class="score"><b id="score-you">0</b><i>:</i><b id="score-bot">0</b></span>
        <span id="lvl" class="side-label right"></span>
      </header>
      <p id="drag-hint" class="drag-hint">Hold and drag your mallet</p>
      <pre id="debug" hidden></pre>
    </section>
    <section id="result" class="screen" hidden>
      <div class="card">
        <h2 id="verdict"></h2>
        <p id="final" class="final"></p>
        <p id="saved" class="hint"></p>
        <button id="again" class="primary">Play again</button>
      </div>
    </section>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
