<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feint — game hub</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <section id="level" class="screen hub">
      <div class="hub-head">
        <h1>Feint</h1>
        <p class="tagline">Small games against bots that read you and lie with their bodies.</p>
        <label class="nick">Nick <input id="nick" maxlength="64" autocomplete="nickname" /></label>
        <p class="hint">Press D in a match to see what a bot is thinking, F to speed up a watched match.</p>
      </div>
      <div id="games" class="games"></div>
      <div id="compare" class="compare" hidden></div>
    </section>
    <section id="game" class="screen game" hidden>
      <canvas id="table"></canvas>
      <header class="hud">
        <span id="who" class="side-label"></span>
        <span class="score"><b id="score-you">0</b><i>:</i><b id="score-bot">0</b></span>
        <span id="lvl" class="side-label right"></span>
      </header>
      <p id="drag-hint" class="drag-hint">Hold and drag your mallet</p>
      <pre id="debug-left" hidden></pre>
      <pre id="debug" hidden></pre>
    </section>
    <section id="result" class="screen" hidden>
      <div class="card">
        <h2 id="verdict"></h2>
        <p id="final" class="final"></p>
        <p id="saved" class="hint"></p>
        <button id="again" class="primary">Play again</button>
      </div>
    </section>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
