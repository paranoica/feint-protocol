[project]
name = "feint-train"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["feint-gym", "numpy"]

[dependency-groups]
dev = ["black", "pytest", "ruff"]

[tool.uv]
package = false

[tool.uv.sources]
feint-gym = { path = "../crates/feint-gym" }

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "BLE", "C90"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
